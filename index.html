<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YUÉLÍN Admin</title>
  </head>
  <body>
    <div id="root"><p style="font:16px system-ui;padding:24px;color:#555">Loading admin…</p></div>
    <script>
      // Turns a silent blank page into a readable message.
      (function () {
        function show(m) {
          var r = document.getElementById('root');
          if (r && !r.getAttribute('data-ready')) {
            r.innerHTML = '<pre style="white-space:pre-wrap;font:14px monospace;padding:24px;color:#b00020">App failed to start:\n' + String(m).replace(/</g, '&lt;') + '</pre>';
          }
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT') return show('Could not load ' + (t.src || 'a script') + '. Check the Render publish directory and rewrite rule.');
          show(e.message || e.error);
        }, true);
        window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason); });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
